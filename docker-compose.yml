version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tiffin_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: homemade_tiffin_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tiffin_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiffin_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=homemade_tiffin_db
      - JWT_SECRET=homemade_tiffin_jwt_secret_key_production_2024
      - JWT_EXPIRES_IN=30d
      - OTP_EXPIRY_MINUTES=5
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tiffin_net

volumes:
  mysql_data:
    name: tiffin_mysql_data

networks:
  tiffin_net:
    name: tiffin_network
    driver: bridge

